layout: simple
title: Blog
permalink: /blog.html
---

<h1>Blog</h1>

{% for post in site.blog reversed %}
  <div style="margin-bottom: 2em;">
    <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
    <p class="text-muted">{{ post.date | date: "%B %d, %Y" }}</p>
    <p>{{ post.excerpt }}</p>
  </div>
{% endfor %}

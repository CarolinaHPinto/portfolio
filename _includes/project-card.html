{% assign p = include.project %}
{% assign cat = site.data.project_categories | where: "slug", p.category_slug | first %}
<a class="project-card" href="{{ p.url | relative_url }}" data-cat="{{ p.category_slug }}">
  <span class="project-card__icon" aria-hidden="true"><i class="{{ cat.icon }}"></i></span>
  <span class="project-card__cat">{{ cat.name }}</span>
  <span class="project-card__title">{{ p.title }}</span>
  <span class="project-card__excerpt">{{ p.excerpt | strip_html }}</span>
  <span class="project-card__more">View project <i class="fa-solid fa-arrow-right"></i></span>
</a>

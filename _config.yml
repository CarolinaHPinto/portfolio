# ---------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "default"   # leave as default; colors live in assets/css/main.scss
color_mode: "light"               # "light" or "dark"

locale: "en-US"
title: "Carolina Pinto"
title_separator: "|"
subtitle: "Cybersecurity GRC Analyst"
name: "Carolina Pinto"
description: "Cybersecurity portfolio of Carolina Pinto: GRC, incident response, vulnerability management and hands-on security projects."
url: "https://carolinahpinto.github.io"
baseurl: "/portfolio"
repository: "CarolinaHPinto/portfolio"
logo: # path to a small logo, optional
masthead_title: "Carolina Pinto"
breadcrumbs: false
words_per_minute: 200

search: true
search_full_content: true

# ---------------------------------------------------------------
# Author (shown in the sidebar on the home page, resume and posts)
# ---------------------------------------------------------------
author:
  name: "Carolina Pinto"
  avatar: "/assets/images/headshot.jpg"
  bio: "Helping organizations turn regulation into practical security."
  location: "Miami, Florida"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/carolina-pinto-696675135/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/CarolinaHPinto"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:carolinahnpinto@gmail.com"

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/carolina-pinto-696675135/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/CarolinaHPinto"

# ---------------------------------------------------------------
# Reading files
# ---------------------------------------------------------------
include:
  - _pages
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# ---------------------------------------------------------------
# Build
# ---------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
permalink: /blog/:year/:month/:title/
paginate: 8
paginate_path: /blog/page:num/
timezone: America/New_York

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

# Archive pages for blog tags and categories
category_archive:
  type: liquid
  path: /blog/categories/
tag_archive:
  type: liquid
  path: /blog/tags/

# ---------------------------------------------------------------
# Collections
# ---------------------------------------------------------------
collections:
  projects:
    output: true
    permalink: /projects/:name/

# ---------------------------------------------------------------
# Defaults
# ---------------------------------------------------------------
defaults:
  # blog posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: false
      related: true
      show_date: true
      toc: false
  # projects
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      author_profile: false
      share: false
      toc: false
      classes: [wide, project-page]
  # pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
